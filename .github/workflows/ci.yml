name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - name: Retrieval evaluation (fictional set, ADR 013)
        run: uv run personal-brain eval --cases eval/cases.fictional.yaml --records examples/records

  container:
    # Builds the image, runs it on fictional records and checks that query terms never reach the logs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker build -t personal-brain:ci .
      - name: Run container on fictional records
        run: |
          docker run -d --name pb -p 127.0.0.1:8000:8000 \
            -v "$PWD/examples/records:/data/records:ro" personal-brain:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pb)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' pb | grep -q healthy
      - name: Log privacy check (ADR 007)
        run: |
          uv sync
          uv run personal-brain check-logs --url http://127.0.0.1:8000/mcp --logs-command "docker logs pb"
      - name: Container runs as non-root
        run: test "$(docker exec pb id -u)" != "0"
      - name: /data/auth exists in the image, owner 10001, mode 700
        run: |
          test "$(docker run --rm --entrypoint stat personal-brain:ci -c '%u %a' /data/auth)" = "10001 700"
      - name: A new named volume on /data/auth is writable without a preparation container
        run: |
          docker volume create pb-auth-ci
          docker run --rm -v pb-auth-ci:/data/auth --entrypoint sh personal-brain:ci \
            -c 'touch /data/auth/probe && test "$(stat -c %u /data/auth)" = 10001'
          docker volume rm pb-auth-ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
