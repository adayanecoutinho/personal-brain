[project]
name = "personal-brain"
version = "0.1.0"
description = "A personal memory MCP server: every answer cites its source."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adayane Coutinho" }]
dependencies = [
    "httpx>=0.29.0",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.scripts]
personal-brain = "personal_brain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/personal_brain/evaluation.py" = ["ISC004"]
